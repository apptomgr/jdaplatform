{% load i18n %}
<style type="text/css">
    /* Financials App / Analytics App: non-interactive tile for non-admin/non-staff
       users while those apps aren't ready yet. Icon and label stay full color
       (unlike the header nav's greyed-out treatment) - only the click/navigation
       behavior is removed. */
    .app-tile-disabled {
        cursor: default;
        pointer-events: none;
    }
</style>

<div class="card shadow-sm p-2 mb-2 bg-white rounded">

    <!-- ======= Services Section ======= -->
    <div id="services" class="services-area my_area-padding">
        <div class="container-fluid">
            <div class="row text-center">
                <!-- Start Left services -->
                <div class="col-md-4 col-sm-12 col-xs-12">
                    <div class="about-move">
                        <div class="services-details">
                            <div class="single-services">
                                <a class="services-icon" href="{% url 'jdapublicationsapp_home' %}">
                                    <i class="fas fa-newspaper fa-2x my_info_txt"></i>
                                </a>
                                <h4> {% trans 'Publications App' %}</h4>
                                <!--p>
                                    <i class="far fa-check-circle my_info_txt"></i> Daily Market briefings
                                    <i class="far fa-check-circle my_info_txt"></i> Weekly Comments
                                    <i class="far fa-check-circle my_info_txt"></i> Annual Reports

                                </p-->
                            </div>
                        </div>
                        <!-- end about-details -->
                    </div>
                </div>
                <div class="col-md-4 col-sm-12 col-xs-12 vl">
                    <div class="about-move">
                        <div class="services-details">
                            <div class="single-services">
                                {% if user.is_staff or user.is_superuser %}
                                <a class="services-icon" href="{% url 'jdaanalyticsapp_home' %}">
                                    <i class="fas fa-chart-line fa-2x my_info_txt"></i>
                                </a>
                                {% else %}
                                <a class="services-icon app-tile-disabled" aria-disabled="true">
                                    <i class="fas fa-chart-line fa-2x my_info_txt"></i>
                                </a>
                                {% endif %}
                                <h4> {% trans 'Analytics App' %} </h4>
                                <!--p>
                                    <i class="far fa-check-circle my_info_txt"></i> Valuation Models

                                    <i class="far fa-check-circle my_info_txt"></i> Portfolio insights
                                </p-->
                            </div>
                        </div>
                        <!-- end about-details -->
                    </div>
                </div>
                <div class="col-md-4 col-sm-12 col-xs-12 vl">
                    <!-- end col-md-4 -->
                    <div class=" about-move">
                        <div class="services-details">
                            <div class="single-services">
                                {% if user.is_staff or user.is_superuser %}
                                <a class="services-icon" href="{% url 'jdafinancialsapp_home' %}">
                                    <i class="far fa-compass fa-2x my_info_txt"></i>
                                </a>
                                {% else %}
                                <a class="services-icon app-tile-disabled" aria-disabled="true">
                                    <i class="far fa-compass fa-2x my_info_txt"></i>
                                </a>
                                {% endif %}

                                <h4>{% trans 'Financials App' %}</h4>

                                </p-->

                        </div>
                        <!-- end about-details -->
                    </div>

            </div>
        </div>
