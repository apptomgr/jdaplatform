{% extends 'jdamainapp/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="fa fa-file-excel-o fa-3x text-muted mb-3" aria-hidden="true"></i>
            <h4 class="mb-2">{{ publication.subject }}</h4>
            <p class="text-muted mb-4">
                {% trans "This publication can't be previewed in the browser. Download it to view the contents." %}
            </p>
            <a href="{{ download_url }}" class="btn btn-info">
                <i class="fa fa-download" aria-hidden="true"></i>
                {% trans "Download" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
