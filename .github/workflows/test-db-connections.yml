name: Test database connections

on:
  workflow_dispatch:

jobs:
  verify-db-connections:
    runs-on: ubuntu-latest

    steps:
      - name: Verify production and test secrets are different
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL is not configured."
            exit 1
          fi

          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "TEST_DATABASE_URL is not configured."
            exit 1
          fi

          if [ "$PROD_DATABASE_URL" = "$TEST_DATABASE_URL" ]; then
            echo "SAFETY CHECK FAILED: production and test database URLs are identical."
            exit 1
          fi

          echo "Safety check passed: production and test database URLs are different."

      - name: Verify production database connection
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL \
            -e PGCONNECT_TIMEOUT=10 \
            postgres:17 \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "SELECT current_database() AS database, current_user AS user, version() AS server_version;"

      - name: Verify test database connection
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL \
            -e PGCONNECT_TIMEOUT=10 \
            postgres:17 \
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "SELECT current_database() AS database, current_user AS user, version() AS server_version;"
