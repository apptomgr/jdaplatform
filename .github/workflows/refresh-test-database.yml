name: Refresh TEST database from PROD

on:
  workflow_dispatch:

jobs:
  refresh-test-database:
    runs-on: ubuntu-latest

    steps:
      - name: Verify database secrets are configured and different
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "PROD_DATABASE_URL is not configured."
            exit 1
          fi

          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "TEST_DATABASE_URL is not configured."
            exit 1
          fi

          if [ "$PROD_DATABASE_URL" = "$TEST_DATABASE_URL" ]; then
            echo "SAFETY CHECK FAILED: production and test database URLs are identical."
            exit 1
          fi

          echo "Database URL safety check passed."

      - name: Verify production database
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL \
            -e PGCONNECT_TIMEOUT=10 \
            postgres:17 \
            psql "$DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  current_database() AS database,
                  current_user AS user,
                  inet_server_addr() AS server_address,
                  version() AS server_version;
              "

      - name: Verify TEST database
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          docker run --rm \
            -e DATABASE_URL \
            -e PGCONNECT_TIMEOUT=10 \
            postgres:17 \
            psql "$DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  current_database() AS database,
                  current_user AS user,
                  inet_server_addr() AS server_address,
                  version() AS server_version;
              "

      - name: Inspect TEST identity columns
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "Identity columns currently present in TEST:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  table_schema,
                  table_name,
                  column_name,
                  identity_generation
                FROM information_schema.columns
                WHERE is_identity = 'YES'
                ORDER BY table_schema, table_name, column_name;
              "

      - name: Inspect TEST database privileges
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "TEST database privilege information:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  current_database() AS database,
                  current_user AS user,
                  session_user AS session_user,
                  r.rolsuper AS is_superuser,
                  r.rolcreatedb AS can_create_database,
                  r.rolcreaterole AS can_create_role,
                  r.rolcanlogin AS can_login,
                  has_database_privilege(
                    current_user,
                    current_database(),
                    'CREATE'
                  ) AS has_create_database_privilege,
                  has_database_privilege(
                    current_user,
                    current_database(),
                    'CONNECT'
                  ) AS has_connect_privilege
                FROM pg_roles r
                WHERE r.rolname = current_user;
              "

          echo "TEST database owner:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  d.datname AS database,
                  r.rolname AS owner
                FROM pg_database d
                JOIN pg_roles r
                  ON r.oid = d.datdba
                WHERE d.datname = current_database();
              "

      - name: Inspect TEST public schema privileges
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "TEST public schema ownership and privileges:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  n.nspname AS schema_name,
                  r.rolname AS schema_owner,
                  n.nspacl AS access_privileges,
                  has_schema_privilege(
                    current_user,
                    'public',
                    'USAGE'
                  ) AS has_usage,
                  has_schema_privilege(
                    current_user,
                    'public',
                    'CREATE'
                  ) AS has_create,
                  (
                    r.rolname = current_user
                  ) AS is_schema_owner
                FROM pg_namespace n
                JOIN pg_roles r
                  ON r.oid = n.nspowner
                WHERE n.nspname = 'public';
              "   

      - name: Inspect TEST table ownership
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "TEST application table ownership:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  n.nspname AS schema_name,
                  c.relname AS table_name,
                  r.rolname AS table_owner
                FROM pg_class c
                JOIN pg_namespace n
                  ON n.oid = c.relnamespace
                JOIN pg_roles r
                  ON r.oid = c.relowner
                WHERE n.nspname = 'public'
                  AND c.relkind IN ('r', 'p')
                ORDER BY c.relname;
              "              

      - name: Preview TEST table reset
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "TEST tables that would be removed before PROD restore:"

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  'DROP TABLE IF EXISTS '
                  || quote_ident(n.nspname)
                  || '.'
                  || quote_ident(c.relname)
                  || ' CASCADE;'
                AS drop_statement
                FROM pg_class c
                JOIN pg_namespace n
                  ON n.oid = c.relnamespace
                JOIN pg_roles r
                  ON r.oid = c.relowner
                WHERE n.nspname = 'public'
                  AND c.relkind IN ('r', 'p')
                  AND r.rolname = current_user
                ORDER BY c.relname;
              "

      - name: Reset TEST tables and restore from PROD
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "Starting production → TEST database refresh..."
          echo "TEST tables will be replaced before the restore."
          echo "No database dump will be stored as a GitHub artifact."

          echo "Dropping existing TEST tables..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                DO \$\$
                DECLARE
                  r RECORD;
                BEGIN
                  FOR r IN
                    SELECT schemaname, tablename
                    FROM pg_tables
                    WHERE schemaname = 'public'
                  LOOP
                    EXECUTE format(
                      'DROP TABLE IF EXISTS %I.%I CASCADE',
                      r.schemaname,
                      r.tablename
                    );
                  END LOOP;
                END
                \$\$;
              "

          echo "Existing TEST tables removed."

          echo "Creating temporary production dump..."

          DUMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$DUMP_DIR"' EXIT

          docker run --rm \
            -e PROD_DATABASE_URL \
            -v "$DUMP_DIR:/dump" \
            postgres:17 \
            pg_dump \
              "$PROD_DATABASE_URL" \
              --format=custom \
              --no-owner \
              --no-acl \
              --file=/dump/prod.dump

          echo "Production dump created temporarily."

          echo "Restoring production database into TEST..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            -v "$DUMP_DIR:/dump" \
            postgres:17 \
            pg_restore \
              --dbname="$TEST_DATABASE_URL" \
              --no-owner \
              --no-acl \
              --exit-on-error \
              /dump/prod.dump

          echo "Production → TEST restore completed successfully."
          
      - name: Validate refreshed TEST database
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail

          echo "Validating refreshed TEST database..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  current_database() AS database,
                  current_user AS user,
                  version() AS server_version;
              "

          echo "Checking TEST table count..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT COUNT(*) AS table_count
                FROM pg_tables
                WHERE schemaname = 'public';
              "

          echo "Checking Django migration state..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "
                SELECT
                  app,
                  COUNT(*) AS migrations_applied
                FROM django_migrations
                GROUP BY app
                ORDER BY app;
              "

          echo "Running ANALYZE on TEST..."

          docker run --rm \
            -e TEST_DATABASE_URL \
            postgres:17 \
            psql "$TEST_DATABASE_URL" \
              -v ON_ERROR_STOP=1 \
              -c "ANALYZE;"

          echo "TEST database validation completed successfully."
