{% extends 'jdamainapp/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-lg-5 col-md-7 col-sm-12">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-center" role="alert">
            <a class="close" data-dismiss="alert">x</a>
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <div class="card shadow-sm p-4 bg-white rounded">
            <div class="text-center mb-3">
                <i class="fa fa-envelope fa-2x my_info_txt"></i>
            </div>
            <h5 class="text-center font-weight-bold mb-3">{% trans "Resend Verification Email" %}</h5>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="{% trans 'Your email address' %}" required>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn btn-info btn-sm mr-2">{% trans "Send" %}</button>
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">{% trans "Back to Login" %}</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
