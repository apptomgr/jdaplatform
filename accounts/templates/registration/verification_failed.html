{% extends 'jdamainapp/base.html' %}
{% load i18n %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-lg-5 col-md-7 col-sm-12">
        <div class="card shadow-sm p-4 bg-white rounded text-center">
            <div class="mb-3">
                <i class="fa fa-times-circle fa-3x text-danger"></i>
            </div>
            <h4 class="font-weight-bold mb-3">{% trans "Verification Failed" %}</h4>
            <p class="text-muted">{% trans "This verification link is invalid, has expired, or has already been used." %}</p>
            <div class="mt-3">
                <a href="{% url 'resend_verification' %}" class="btn btn-info btn-sm mr-2">
                    {% trans "Resend Verification Email" %}
                </a>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">
                    {% trans "Back to Login" %}
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
